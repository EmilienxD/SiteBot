name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # docs/04-providers-and-engine.md §10: no test in the default pipeline may
  # make a real provider call. No provider keys are exposed to this workflow.
  CI: true
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Security test
        run: pnpm test:security

      - name: Bundle size
        run: pnpm size

      - name: Package checks (publint, are-the-types-wrong)
        run: pnpm check:packages

  sqlite-native:
    # Exercise actual SQLite session persistence, including the minimum Node
    # release with node:sqlite. Initialization errors must fail.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22.13.0', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sitebot/core... build
      - name: SQLite session tests
        run: pnpm exec vitest run --project=core packages/core/src/node/session-stores.test.ts

  e2e:
    # The Playwright image pins browsers *and fonts*, so the committed
    # `-linux` visual baselines match byte-for-byte what CI renders.
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # Browser tests against the plain-html example with a scripted offline
      # model — rendering, streaming, client tools, approval, mobile, iframe,
      # axe-core on every state, and visual snapshots.
      - name: Browser tests
        run: pnpm e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  examples:
    # Each example from a clean checkout: `doctor` against its real config
    # (dummy keys, --offline), then a smoke run against the scripted offline
    # model (e2e/fixtures/scripted-model.mjs). No provider is called.
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: sk-ant-ci-dummy-key
      OPENAI_API_KEY: sk-ci-dummy-key
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Builds the packages and examples/nextjs.
      - run: pnpm build

      - name: Inspect Next.js production artifact
        run: pnpm check:nextjs-artifact

      - name: Doctor
        run: |
          for example in plain-html nextjs express-sidecar cloudflare-worker; do
            echo "::group::$example"
            (cd examples/$example && node ../../packages/cli/dist/cli.js doctor --offline)
            echo "::endgroup::"
          done

      - name: Smoke — nextjs
        working-directory: examples/nextjs
        run: node ../../test/smoke/nextjs-standalone.mjs

      - name: Smoke — express-sidecar
        working-directory: examples/express-sidecar
        env:
          SITEBOT_CONFIG: ../../test/smoke/express-sidecar.config.mjs
        run: |
          node server.mjs > sidecar.log 2>&1 &
          node ../../test/smoke/smoke.mjs --endpoint http://localhost:8787/api/chat \
            --origin http://localhost:8000 --key pk_fernhill_demo \
            --asset http://localhost:8787/widget/sitebot.js \
            || (cat sidecar.log; exit 1)

      - name: Edge build — cloudflare-worker
        working-directory: examples/cloudflare-worker
        run: |
          pnpm build:check
          # Static node:* imports would fail on Workers without nodejs_compat.
          if grep -nE 'from ?"node:|import ?"node:' dist/worker.js; then
            echo "::error::node:* import in the Worker bundle"; exit 1
          fi
